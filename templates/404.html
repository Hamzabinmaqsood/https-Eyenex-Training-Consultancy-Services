{% extends 'base.html' %}

{% block page_title %}Page Not Found | {{ site_name }}{% endblock %}

{% block content %}

<section class="section-padding">
    <div class="container text-center">
        <h1 class="fw-bold">404</h1>
        <p class="lead text-muted">
            Sorry, the page you are looking for could not be found. It may have been moved or no longer exists.
        </p>

        <div class="mt-4 d-flex flex-wrap justify-content-center gap-3">
            <a href="{% url 'core:home' %}" class="btn btn-brand">
                Back to Home
            </a>

            <a href="{% url 'courses:course_list' %}" class="btn btn-outline-dark">
                View Courses
            </a>
        </div>
    </div>
</section>

{% endblock %}
